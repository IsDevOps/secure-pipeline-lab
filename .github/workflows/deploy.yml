name: deploy
on: [push, workflow_dispatch]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4   # pinned to a tag (weak, on purpose)
        with:
          role-to-assume: arn:aws:iam::776566309511:role/gha-deploy-role
          aws-region: us-east-1
      - run: aws sts get-caller-identity

      